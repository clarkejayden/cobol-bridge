[project]
name = "cobol-bridge"
version = "0.1.0"
description = "LLM-assisted COBOL-to-Java translation, verified by differential testing against GnuCOBOL."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
cobol-bridge = "cobol_bridge.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cobol_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "toolchain: needs cobc and a JDK 21 on this machine",
]
