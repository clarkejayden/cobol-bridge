name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fail rather than skip toolchain tests if cobc or the JDK is missing.
      COBOL_BRIDGE_REQUIRE_TOOLCHAIN: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          cobc --version | head -n 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest -q
